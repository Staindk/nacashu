name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  watchapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Pebble SDK
        run: |
          uv tool install pebble-tool
          pebble sdk install latest
      - name: Build watchapp
        working-directory: watch
        run: pebble build
      - uses: actions/upload-artifact@v4
        with:
          name: nacashu-watchapp
          path: watch/build/*.pbw

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NACASHU_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nacashu.jks"
          echo "NACASHU_KEYSTORE=$RUNNER_TEMP/nacashu.jks" >> "$GITHUB_ENV"
      - name: Build companion app
        working-directory: android
        env:
          NACASHU_KEYSTORE_PASSWORD: ${{ secrets.NACASHU_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nacashu-android
          path: android/app/build/outputs/apk/debug/*.apk
