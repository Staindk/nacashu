name: Watch

on:
  push:
    branches: [main]
  pull_request:
    # PRs only build what they touch; main and manual runs build everything.
    paths:
      - 'watch/**'
      - '.github/workflows/watch.yml'
  workflow_dispatch:

jobs:
  watchapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Pebble SDK and emulator libraries
        run: |
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 xvfb
          uv tool install pebble-tool
          pebble sdk install latest
      - name: Build watchapp
        working-directory: watch
        run: pebble build
      - uses: actions/upload-artifact@v4
        with:
          name: nacashu-watchapp
          path: watch/build/*.pbw
      - name: Take emulator screenshots
        env:
          DISPLAY: ':99'
        run: |
          # The emulator opens an SDL window, so give it a virtual display.
          Xvfb :99 &
          mkdir shots
          for platform in emery flint gabbro; do
            start=$SECONDS
            pebble install --emulator $platform watch/build/*.pbw
            sleep 2
            pebble screenshot --emulator $platform --no-open shots/$platform-1-ready.png
            pebble emu-button --emulator $platform click select
            sleep 1
            pebble screenshot --emulator $platform --no-open shots/$platform-2-snap.png
            pebble kill
            echo "$platform: $((SECONDS - start))s"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*.png
