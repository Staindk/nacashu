name: Watch

on:
  push:
    branches: [main]
  pull_request:
    # PRs only build what they touch; main and manual runs build everything.
    paths:
      - 'watch/**'
      - '.github/workflows/watch.yml'
  workflow_dispatch:

# A newer push to the same PR replaces this run, so two runs never race to commit screenshots.
concurrency:
  group: watch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  watchapp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # On a PR, build the branch itself (not GitHub's merge preview) so screenshots can be committed back to it.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
      - name: Install Pebble SDK and emulator libraries
        run: |
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 xvfb faketime
          uv tool install pebble-tool
          pebble sdk install latest
      - name: Build watchapp
        working-directory: watch
        run: pebble build
      - uses: actions/upload-artifact@v4
        with:
          name: nacashu-watchapp
          path: watch/build/*.pbw
      - name: Take emulator screenshots
        env:
          DISPLAY: ':99'
        run: |
          # The emulator opens an SDL window, so give it a virtual display.
          Xvfb :99 &
          mkdir shots
          # The watchapp shows the time, so pin it to 10:09 to keep screenshots the same between runs.
          # pebble-tool sends the host's time to the emulator every time it connects, and the app
          # reads the clock when it opens, so every pebble command runs under faketime, including
          # install (which also starts QEMU). The clock still ticks from 10:09, so sleeps work.
          pin() { TZ=UTC faketime -f '@2026-01-01 10:09:00' pebble "$@"; }
          for platform in emery flint gabbro; do
            start=$SECONDS
            pin install --emulator $platform watch/build/*.pbw
            sleep 2
            pin screenshot --emulator $platform --no-open shots/$platform-1-ready.png
            pin emu-button --emulator $platform click select
            sleep 1
            pin screenshot --emulator $platform --no-open shots/$platform-2-snap.png
            # Timer 3 s and endless photos, to show both rows of choices.
            pin emu-button --emulator $platform click up
            for i in 1 2 3; do pin emu-button --emulator $platform click down; done
            sleep 6
            pin screenshot --emulator $platform --no-open shots/$platform-3-choices.png
            pebble kill
            echo "$platform: $((SECONDS - start))s"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*.png
      - name: Commit changed screenshots to the PR
        # Only on PRs from this repo: fork PRs get a read-only token.
        if: github.event_name == 'pull_request'
        env:
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          BRANCH: ${{ github.head_ref }}
        run: |
          # Compare pixels, not bytes, so a re-encoded but identical PNG isn't a change.
          ~/.local/share/uv/tools/pebble-tool/bin/python watch/tools/update_screenshots.py shots docs
          if [ -z "$(git status --porcelain -- docs)" ]; then
            echo "Screenshots unchanged."
            exit 0
          fi
          if [ "$SAME_REPO" != true ]; then
            echo "::warning::Screenshots changed, but this PR is from a fork so CI can't commit them. Copy them from the screenshots artifact into docs/."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          # [skip ci] stops GitHub creating a Watch run for the bot's push, which would otherwise wait for approval.
          git commit -m 'Update emulator screenshots [skip ci]'
          git push origin "HEAD:refs/heads/$BRANCH" ||
            echo "::warning::Couldn't push screenshots, probably because the branch moved. The next run will try again."
