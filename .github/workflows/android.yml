name: Android

on:
  push:
    branches: [main]
  pull_request:
    # PRs only build what they touch; main and manual runs build everything.
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      # The Help screen shows this screenshot.
      - 'docs/emery-1-ready.png'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NACASHU_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nacashu.jks"
          echo "NACASHU_KEYSTORE=$RUNNER_TEMP/nacashu.jks" >> "$GITHUB_ENV"
      - name: Build companion app
        working-directory: android
        env:
          NACASHU_KEYSTORE_PASSWORD: ${{ secrets.NACASHU_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nacashu-android
          path: android/app/build/outputs/apk/debug/*.apk
      # The release bundle is what goes to Google Play. It's only built on main and manual runs,
      # and only with the signing key, because Play rejects a bundle signed with a debug key.
      - name: Build release bundle for Google Play
        if: github.event_name != 'pull_request' && env.NACASHU_KEYSTORE != ''
        working-directory: android
        env:
          NACASHU_KEYSTORE_PASSWORD: ${{ secrets.NACASHU_KEYSTORE_PASSWORD }}
        run: ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && env.NACASHU_KEYSTORE != ''
        with:
          name: nacashu-android-release
          path: android/app/build/outputs/bundle/release/*.aab
